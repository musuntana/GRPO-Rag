name: Full integration (manual)
# Expensive PG + Qdrant + Poppler suite. NEVER trigger on push or PR synchronize.
on:
  push:
    branches:
      - feat/s1-chat-durable-idempotency-claim
  workflow_dispatch:
    inputs:
      reason:
        description: Why is a full integration validation needed?
        type: choice
        required: true
        default: pre-merge
        options:
          - pre-merge
          - release
          - regression
          - incident
permissions:
  contents: read
concurrency:
  group: full-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-validation-only
          POSTGRES_DB: ragos_s0
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.1-unprivileged
        ports: [6333:6333]
    env:
      RAGOS_APP_ENV: test
      RAGOS_QDRANT_URL: ""
      RAGOS_TEST_QDRANT_URL: http://127.0.0.1:6333
      RAGOS_PG_DSN: postgresql://postgres:local-validation-only@127.0.0.1:5432/ragos_s0
      RAGOS_TEST_PG_DSN: postgresql+psycopg://postgres:local-validation-only@127.0.0.1:5432/ragos_s0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.23
      - name: Ensure Poppler PDF text extractor for real-byte contract tests
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          command -v pdftotext
      - name: Check disposable Qdrant service readiness
        run: |
          python - <<'PY'
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          for attempt in range(30):
              try:
                  with urlopen("http://127.0.0.1:6333/healthz", timeout=2) as response:
                      if response.status == 200:
                          print("Qdrant HTTP service ready")
                          break
              except (URLError, TimeoutError, OSError):
                  pass
              time.sleep(1)
          else:
              raise SystemExit("Qdrant did not become ready")
          PY
      - run: uv sync --frozen --no-editable --extra dev --python 3.12
      - run: .venv/bin/ruff check apps packages tests scripts infra/migrations/env.py infra/migrations/versions/0009_fail_closed_rls.py infra/migrations/versions/0010_immutable_evidence_lineage.py infra/migrations/versions/0011_index_reconciliation.py infra/migrations/versions/0012_task_execution_lifecycle.py infra/migrations/versions/0013_chat_request_claims.py
      - run: .venv/bin/alembic upgrade head
      - run: .venv/bin/pytest -q
      - run: .venv/bin/python scripts/verify_s0_processes.py
      - run: .venv/bin/alembic check
